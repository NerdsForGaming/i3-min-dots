; ─── Rose Pine Moon polybar ────────────────────────────────────

[colors]
; Monochrome + sparse amber
background     = #ff1a1a1d
background-alt = #232327
overlay        = #2e2e34
foreground     = #f2f2f2
muted          = #909094
subtle         = #5e5e62
mauve          = #c8c8c8
pine           = #c8c8c8
foam           = #c8c8c8
gold           = #e0c373
rose           = #c8c8c8
love           = #b56565
alpha          = #00000000

; ─── Bar ───────────────────────────────────────────────────────

[bar/Bar1]
monitor = ${env:MONITOR:HDMI-1-0}
width = 100%
height = 26
offset-y = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 1
padding-right = 1
module-margin-left = 0
module-margin-right = 0

border-top-size = 0
border-bottom-size = 0
border-color = ${colors.alpha}

line-size = 2
wm-restack = i3
enable-ipc = true

font-0 = JetBrainsMono Nerd Font:size=9;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=9;2
font-2 = JetBrainsMono Nerd Font:style=Italic:size=9;2
font-3 = Symbols Nerd Font Mono:size=11;3

modules-left = menu sep i3 sep title
modules-center =
modules-right = pulseaudio sep backlight sep cpu sep mem sep battery sep date sep network sep bluetooth sep powermenu

cursor-click = pointer
cursor-scroll = ns-resize

; ─── System tray (only the primary polybar instance owns it) ──
; TRAY_POSITION is set to "right" by launch.sh for the primary
; monitor and "none" for all others, so only one bar claims the tray.
tray-position = ${env:TRAY_POSITION:none}
tray-detached = false
tray-maxsize = 18
tray-padding = 4
tray-background = ${colors.background}
tray-foreground = ${colors.foreground}

; ─── Separators ────────────────────────────────────────────────

[module/sep]
type = custom/text
content = "  "
content-foreground = ${colors.background}

; ─── Launcher / powermenu pills ────────────────────────────────

[module/menu]
type = custom/text
content = "   "
content-foreground = ${colors.background-alt}
content-background = ${colors.gold}
content-font = 2
click-left = rofi -show drun

[module/powermenu]
type = custom/text
content = "  ⏻  "
content-foreground = ${colors.foreground}
content-background = ${colors.overlay}
content-font = 2
click-left = exec ~/.config/i3/scripts/powermenu

; ─── network & bluetooth (themed, replace GTK tray icons) ──────
[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 5
click-left = ~/.config/rofi/scripts/rofi-network &
format-prefix = " "
format-suffix = " "
format-foreground = ${colors.foreground}
format-background = ${colors.background-alt}
format-font = 1

[module/bluetooth]
type = custom/script
; Skip the module entirely when bluez isn't installed yet.
exec-if = command -v bluetoothctl
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = ~/.config/rofi/scripts/rofi-bluetooth &
format-prefix = " "
format-suffix = " "
format-foreground = ${colors.foreground}
format-background = ${colors.background-alt}
format-font = 1

; ─── i3 workspaces ─────────────────────────────────────────────

[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
fuzzy-match = false

format = <label-state> <label-mode>
ws-icon-default =
label-mode = " %mode% "
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.gold}

label-focused = " %name% "
label-focused-foreground = ${colors.background-alt}
label-focused-background = ${colors.gold}

label-visible = " %name% "
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.overlay}

label-unfocused = " %name% "
label-unfocused-foreground = ${colors.subtle}

label-urgent = " %name% "
label-urgent-foreground = ${colors.foreground}
label-urgent-background = ${colors.love}

; ─── Active window title ───────────────────────────────────────

[module/title]
type = internal/xwindow
format = <label>
format-padding = 1
format-foreground = ${colors.subtle}
format-font = 3
label = " %title% "
label-maxlen = 60
label-empty =

; ─── System modules ────────────────────────────────────────────

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-padding = 1
format-volume-foreground = ${colors.foreground}
label-volume = "   %percentage%%"
label-muted = "   mute"
format-muted-padding = 1
format-muted-foreground = ${colors.muted}
click-right = exec pavucontrol

[module/backlight]
type = internal/backlight
card = amdgpu_bl2
format = <label>
format-padding = 1
format-foreground = ${colors.foreground}
label = "   %percentage%%"
enable-scroll = true

[module/cpu]
type = internal/cpu
interval = 2.5
format = <label>
format-padding = 1
format-foreground = ${colors.foreground}
label = "   %percentage%%"

[module/mem]
type = custom/script
exec = free -m | awk '/^Mem:/ {print $3}'
interval = 5
format = <label>
format-padding = 1
format-foreground = ${colors.foreground}
label = "   %output%M"

[module/battery]
type = internal/battery
full-at = 98
battery = BAT0
adapter = ACAD
poll-interval = 30

format-charging = <label-charging>
format-charging-padding = 1
format-charging-foreground = ${colors.pine}
label-charging = "   %percentage%%"

format-discharging = <label-discharging>
format-discharging-padding = 1
format-discharging-foreground = ${colors.foreground}
label-discharging = "   %percentage%%"

format-full = <label-full>
format-full-padding = 1
format-full-foreground = ${colors.pine}
label-full = "   full"

[module/date]
type = internal/date
interval = 1
date = "%a %d %b"
date-alt = "%a %d %b %Y"
time = "%H:%M"
time-alt = "%H:%M:%S"
format = <label>
format-padding = 1
format-foreground = ${colors.foreground}
format-background = ${colors.background-alt}
label = "   %date%      %time% "
