# rice.conf — sourced by the rice tooling.
#
# Override these by editing this file or by exporting the same names
# in your shell before running rice-update / rice-update-check.

# Git remote to pull updates from. Set this to YOUR fork before
# publishing the rice. The startup checker no-ops if this is empty
# or still points at the placeholder.
RICE_REPO_URL="${RICE_REPO_URL:-}"

# Branch the updater tracks.
RICE_BRANCH="${RICE_BRANCH:-main}"

# Where AppImages live (drop *.AppImage files here and they appear
# in the rofi launcher's AppImages tab).
APPIMAGE_DIR="${APPIMAGE_DIR:-$HOME/appimages}"

# Subdirs of ./config/ to symlink into ~/.config/.
RICE_CONFIGS=(i3 polybar rofi picom kitty alacritty dunst eww)
